services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: recap
      POSTGRES_PASSWORD: recap
      POSTGRES_DB: recap
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recap -d recap"]
      interval: 2s
      timeout: 2s
      retries: 20
